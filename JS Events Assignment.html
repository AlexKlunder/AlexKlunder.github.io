<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>JS Events Assignment</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #box {
            width: 150px;
            height: 150px;
            background: gray;
            margin: 20px auto;
        }
    </style>
</head>
<body>

<h1 id="title">Hello</h1>

<!-- 1️⃣ Input -->
<input type="text" id="textInput" placeholder="Change heading">

<br><br>

<!-- 2️⃣ Select -->
<select id="colorSelect">
    <option value="">Choose color</option>
    <option value="red">Red</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
</select>

<br><br>

<!-- 3️⃣ Slider -->
<input type="range" id="sizeSlider" min="50" max="300" value="150">

<div id="box" style="width: 50px; height: 50px; background-color: red;"></div>

<script>
    // Input changes heading text
    document.getElementById("textInput").addEventListener("input", function() {
        document.getElementById("title").textContent = this.value;
    });

    // Select changes box color
    document.getElementById("colorSelect").addEventListener("change", function() {
        document.getElementById("box").style.backgroundColor = this.value;
    });

    // Slider changes box size
    document.getElementById("sizeSlider").addEventListener("input", function() {
        let size = this.value + "px";
        document.getElementById("box").style.width = size;
        document.getElementById("box").style.height = size;
    });
</script>
